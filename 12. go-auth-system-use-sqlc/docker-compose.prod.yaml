# Run guide: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: auth_postgres_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auth_redis_dev

  api:
    build:
      context: .
      target: development # <--- Sử dụng stage development trong Dockerfile
    container_name: auth_api_dev
    ports:
      - "${API_SERVER_PORT}:${API_SERVER_PORT}"
    volumes:
      - .:/app # Mount source code để hot-reload chạy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

volumes:
  postgres_data_dev:
