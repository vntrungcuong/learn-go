# Run guide:
# docker compose up -d db redis
# docker compose up
services:
  db:
    image: postgres:16-alpine
    container_name: auth_postgres_dev
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auth_redis_dev
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck: # [ADD] Đảm bảo Redis sẵn sàng trước khi App chạy
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: auth_redisinsight_dev
    ports:
      - "5540:5540"
    depends_on:
      - redis

  api:
    build:
      context: .
      target: development # <--- Sử dụng stage development trong Dockerfile
    container_name: auth_api_dev
    ports:
      - "${API_SERVER_PORT}:${API_SERVER_PORT}"
    volumes:
      - .:/app # Mount source code để hot-reload chạy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment: # [IMPORTANT] Ghi đè HOST khi chạy TRONG container
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - REDIS_ADDR=redis:6379

volumes:
  postgres_data_dev:
